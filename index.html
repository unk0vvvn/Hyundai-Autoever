function filtered(){let a=[...R];if(state.market!=='all')a=a.filter(r=>r.market===state.market||r.region===state.market);if(state.domain!=='all')a=a.filter(r=>r.domain===state.domain);if(state.kpi==='open')a=a.filter(r=>!['Released','Rejected'].includes(r.status));if(state.kpi==='reuse')a=a.filter(r=>r.standardReviewComplete&&r.standard==='Global Standard');if(state.kpi==='local')a=a.filter(r=>r.standard==='Local Extension');if(state.kpi==='risk')a=a.filter(r=>['High','Critical'].includes(r.risk));if(state.kpi==='architecture')a=a.filter(r=>r.status==='Architecture Review');let q=state.query.toLowerCase();if(q)a=a.filter(r=>[r.id,r.market,r.region,r.domain,r.subject,r.release].some(v=>String(v||'').toLowerCase().includes(q)));return a.sort((a,b)=>String(a[state.sort.key]||'').localeCompare(String(b[state.sort.key]||''))*(state.sort.dir==='asc'?1:-1))}
function renderRows(){let a=filtered();$('count').textContent=`${a.length} records`;$('rows').innerHTML=a.length?a.map(r=>`<tr data-id="${r.id}" class="${state.selected===r.id?'on':''}"><td><button class="link">${r.id}</button></td><td>${r.market}</td><td>${r.domain}</td><td title="${esc(r.subject)}">${r.subject}</td><td>${badge(r.standard)}</td><td>${badge(r.risk)}</td><td>${badge(r.status)}</td><td>${r.owner}</td><td>${r.updated}</td></tr>`).join(''):`<tr><td colspan="9" style="text-align:center;padding:35px">No change requests match the selected filters.</td></tr>`;document.querySelectorAll('#rows tr[data-id]').forEach(x=>x.onclick=()=>openReq(x.dataset.id))}
function bindOverview(){$('newReq').onclick=openNew;document.querySelectorAll('[data-kpi]').forEach(x=>x.onclick=()=>{state.kpi=state.kpi===x.dataset.kpi?'':x.dataset.kpi;renderOverview()});document.querySelectorAll('[data-market]').forEach(x=>x.onclick=()=>{state.market=x.dataset.market;renderOverview()});$('listSearch').oninput=e=>{state.query=e.target.value;renderRows()};$('domain').onchange=e=>{state.domain=e.target.value;renderRows()};$('reset').onclick=()=>{state.kpi='';state.market='all';state.domain='all';state.query='';renderOverview()};document.querySelectorAll('[data-sort]').forEach(x=>x.onclick=()=>{state.sort.dir=state.sort.key===x.dataset.sort&&state.sort.dir==='asc'?'desc':'asc';state.sort.key=x.dataset.sort;renderOverview()})}
function openReq(id){state.selected=id;state.menu='detail';state.tab='details';log('J. Kim','Requirement',`${id} opened`);render()}
function renderDetail(){let r=fill(current());$('content').innerHTML=`<div class="scroll"><div class="bread"><button class="link" data-back>Global CRM Governance</button><span>›</span><button class="link" data-back>Change Requests</button><span>›</span><b>${r.id}</b></div><section class="record"><div class="rmain"><div class="obj">▤</div><div class="rid"><span class="rtype">Change Request</span><h1>${r.id} · ${r.subject}</h1><p>${r.market} · ${r.domain}</p></div><div class="highlights"><div class="hi"><label>Status</label>${badge(r.status)}</div><div class="hi"><label>Market</label><b>${r.market}</b></div><div class="hi"><label>Risk</label>${badge(r.risk)}</div><div class="hi"><label>Owner</label><b>${r.owner}</b></div></div><div class="ractions">${assistantControl()}<button class="btn" id="edit">Edit</button><button class="btn" id="analyze">Analyze Impact</button><button class="btn primary" id="submit">Submit for Review</button><div class="split"><button class="btn" id="more">⌄</button><div class="amenu hidden" id="amenu"><button id="assign">Assign Release</button><button id="reject">Reject Request</button></div></div></div></div><div class="tabs">${[['related','Related'],['details','Details'],['standard','Standardization'],['impact','Impact'],['history','History']].map(x=>`<button class="tab ${state.tab===x[0]?'on':''}" data-tab="${x[0]}">${x[1]}</button>`).join('')}</div></section><div id="detail"></div></div>`;renderTab(r);bindAssistantControl();document.querySelectorAll('[data-back]').forEach(x=>x.onclick=()=>{state.menu='requirements';render()});document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{state.tab=x.dataset.tab;renderDetail()});$('edit').onclick=()=>openEdit(r);$('analyze').onclick=()=>analyze(r);$('submit').onclick=()=>{r.status='Under Review';log('J. Kim','Review',`${r.id} submitted for review`);toast('Requirement submitted for review.');renderDetail()};$('more').onclick=()=>$('amenu').classList.toggle('hidden');$('assign').onclick=()=>{state.tab='details';renderDetail();setTimeout(()=>$('releaseSelect')?.focus(),0)};$('reject').onclick=()=>{current().status='Rejected';log('J. Kim','Decision',`${r.id} rejected`);toast('Change request rejected.');renderDetail()}}
function decision(r){let selected=r.finalDecision||(r.recommendation==='Regional Mandatory Extension'?'Local Extension':r.recommendation.replace(' Reuse',''));return`<section class="dcard"><div class="dhead">Assistant Recommendation</div><div class="dbody"><div class="reccard"><span>Recommendation</span><b>${r.recommendation}</b><span>Confidence ${r.confidence}%</span></div>${r.risk==='Critical'?'<div class="warning"><b>Human Review Required</b><br>Privacy and legal interpretation must be confirmed by the responsible organization before release.</div>':''}</div></section><section class="dcard"><div class="dhead">Final Decision</div><div class="dbody"><div class="decisions">${['Global Standard','Regional Standard','Local Extension','Request Revision'].map(x=>`<label><input type="radio" name="decision" value="${x}" ${selected===x?'checked':''}> ${x}</label>`).join('')}</div><label class="field"><span>Decision Reason</span><textarea class="reason" id="decisionReason" placeholder="Document the business and architecture rationale...">${esc(r.decisionReason)}</textarea></label><label class="field"><span>Target Release</span><select id="releaseSelect" style="width:100%;height:32px;border:1px solid #ccc"><option value="">Unassigned</option>${releases.map(x=>`<option ${r.release===x.version?'selected':''}>${x.version}</option>`).join('')}</select></label><div class="dactions"><button class="btn" id="saveDecision">Save Decision</button><button class="btn primary" id="submitArch">Submit for Architecture Review</button></div></div></section>`}
function renderTab(r){let d=$('detail');if(state.tab==='details')d.innerHTML=`<div class="detailgrid"><div><section class="dcard"><div class="dhead">Business Requirement</div><div class="dbody fields"><div class="field full"><label>Business Request</label><div>${r.request}</div></div><div class="field full"><label>Business Reason</label><div>${r.reason}</div></div><div class="field"><label>Market</label><div>${r.market}</div></div><div class="field"><label>Domain</label><div>${r.domain}</div></div><div class="field"><label>Requester</label><div>${r.requester}</div></div><div class="field"><label>Due Date</label><div>${r.due}</div></div></div></section><section class="dcard"><div class="dhead">Customer Journey Impact</div><div class="dbody journey">${r.journey.map(x=>`<div class="step ${r.hits.includes(x)?'hit':''}"><span>${x}</span></div>`).join('')}</div></section></div><aside>${decision(r)}</aside></div>`;else if(state.tab==='standard')d.innerHTML=`<div class="detailgrid"><div><section class="dcard"><div class="dhead">Standardization Assessment <span class="score">${r.score} / 100</span></div><div class="dbody">${r.assessment.map(x=>`<div class="assess"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section><section class="dcard"><div class="dhead">Capability Reuse</div><div class="dbody">${r.reuse.map(x=>`<div class="assess"><span>${x[0]}</span>${badge(x[1])}</div>`).join('')}</div></section></div><aside>${decision(r)}</aside></div>`;else if(state.tab==='impact')d.innerHTML=impact(r);else if(state.tab==='history')d.innerHTML=`<section class="dcard"><div class="dhead">Audit History</div><div class="dbody">${state.audit.filter(a=>a.detail.includes(r.id)).map(a=>`<div class="history"><time>${a.at}</time><b>${a.actor}</b><span>${a.type} · ${a.detail}</span></div>`).join('')}</div></section>`;else d.innerHTML=`<section class="dcard"><div class="dhead">Related Requirements and Standards</div><div class="dbody">${r.similar.map(id=>`<div class="related"><button class="link evidence-open" data-evidence="${id}">${id}</button><span>${E[id]?.[2]||'Related record'}</span><span>${E[id]?.[3]||''}</span></div>`).join('')||'No related records identified.'}</div></section>`;bindTab(r)}
function impact(r){if(!state.impact[r.id])return`<section class="dcard"><div class="dhead">Impact Analysis</div><div class="loading"><div><div style="font-size:28px">◎</div><p>Impact analysis has not been run for this request.</p><button class="btn primary" id="runImpact">Analyze Impact</button></div></div></section>`;let card=(t,a)=>`<section class="dcard"><div class="dhead">${t}</div><div class="dbody"><ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul></div></section>`;return`<div class="impactgrid">${card('Affected Objects',r.objects)}${card('Affected APIs',r.apis)}${card('Interfaces',r.interfaces)}${card('Data Changes',r.data)}${card('Regression Scope',r.regression)}<section class="dcard"><div class="dhead">Risk Assessment</div><div class="dbody">${Object.entries(r.risks).map(x=>`<div class="assess"><span>${x[0]}</span>${badge(x[1])}</div>`).join('')}</div></section></div>`}
function bindTab(r){document.querySelectorAll('.evidence-open').forEach(x=>x.onclick=()=>openEvidence(x.dataset.evidence));if($('runImpact'))$('runImpact').onclick=()=>analyze(r);if($('saveDecision'))$('saveDecision').onclick=()=>saveDecision(r,false);if($('submitArch'))$('submitArch').onclick=()=>saveDecision(r,true)}function analyze(r){state.tab='impact';$('detail').innerHTML='<section class="dcard"><div class="loading"><div><div class="spinner"></div><p>Analyzing CRM objects, APIs and interfaces...</p></div></div></section>';setTimeout(()=>{state.impact[r.id]=true;log('CRM Change Assistant','Impact Analysis',`${r.id} impact analysis completed`);toast('Impact analysis completed.');renderDetail()},900)}function saveDecision(r,submit){r=current();r.finalDecision=document.querySelector('input[name="decision"]:checked')?.value||r.recommendation;r.decisionReason=$('decisionReason').value.trim();let old=r.release;r.release=$('releaseSelect').value;if(old!==r.release)log('J. Kim','Release',`${r.id} assigned to ${r.release||'Unassigned'}`);log('J. Kim','Decision',`${r.id} ${r.finalDecision} selected`);if(submit){r.status='Architecture Review';log('J. Kim','Architecture Review',`${r.id} submitted`);toast('Requirement submitted for Architecture Review.')}else toast('Decision saved.');renderDetail()}

function prompts(r){return r.id==='EU-REQ-1042'?['유사한 요구사항 찾아줘','왜 Regional이야?','영향받는 Interface는?','기존 기능 재사용 가능해?']:r.id==='EU-REQ-1176'?['가장 큰 위험은?','관련 Consent 사례 찾아줘','어떤 데이터가 영향을 받아?']:r.id==='APAC-REQ-0831'?['새 기능이 필요해?','Global 기능 재사용 가능해?','Local Extension의 단점은?']:['유사 요구사항을 찾아줘','영향 범위를 알려줘','권장 표준 유형은?']}
function conv(id){return state.conversations[id]||(state.conversations[id]=[{role:'assistant',html:`<p><b>${id}</b> Requirement context is connected.</p><p>과거 요구사항, Global Standard 및 영향 범위를 함께 검토할 수 있습니다.</p>`}])}function renderAssistant(){let r=fill(current());$('assistant').innerHTML=`<div class="ahead"><div class="aid"><span class="aicon">CA</span><div><h2>CRM Change Assistant</h2><p>Requirement context connected · ${r.id}</p></div></div><button class="x" id="closeA">×</button></div><div class="prompts">${prompts(r).map(x=>`<button class="prompt" data-prompt="${esc(x)}">${x}</button>`).join('')}</div><div class="conversation" id="conversation">${conv(r.id).map(message).join('')}</div><form class="composer" id="aform"><textarea id="ainput" placeholder="Ask about similar requirements, impact, risk or reuse..."></textarea><div class="cfoot"><span>Enter to send · Shift+Enter for new line</span><button class="btn primary">Send</button></div></form>`;$('closeA').onclick=()=>{state.assistant=false;render()};document.querySelectorAll('[data-prompt]').forEach(x=>x.onclick=()=>send(x.dataset.prompt));$('aform').onsubmit=e=>{e.preventDefault();send($('ainput').value)};$('ainput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send(e.target.value)}};document.querySelectorAll('.evidence').forEach(x=>x.onclick=()=>openEvidence(x.dataset.evidence));let c=$('conversation');c.scrollTop=c.scrollHeight}
function message(m){let u=m.role==='user';return`<div class="message ${u?'user':''}">${u?'':'<span class="mavatar">CA</span>'}<div class="mwrap"><div class="meta"><b>${u?'CRM Operations':'CRM Change Assistant'}</b>${m.time||''}</div><div class="bubble">${m.html}</div></div>${u?'<span class="mavatar">CO</span>':''}</div>`}function send(text){text=String(text||'').trim();if(!text)return;let r=fill(current()),c=conv(r.id),time=new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false});c.push({role:'user',html:esc(text),time});renderAssistant();$('conversation').insertAdjacentHTML('beforeend','<div class="message"><span class="mavatar">CA</span><div class="bubble"><span class="typing"><i></i><i></i><i></i></span></div></div>');setTimeout(()=>{c.push({role:'assistant',html:answer(r,text),time:new Date().toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit',hour12:false})});log('CRM Change Assistant','Analysis',`${r.id} context analyzed`);renderAssistant()},650)}
function block(label,title,items,summary,evidence=[],confidence=0,warning=false){return`<div class="rec"><span>${label}</span><b>${title}</b>${confidence?`<span>Confidence ${confidence}%</span>`:''}</div><ul>${items.map(x=>`<li>${x}</li>`).join('')}</ul><p>${summary}</p>${warning?'<div class="warning"><b>Human Review Required</b><br>Privacy and legal interpretation must be confirmed by the responsible organization before release.</div>':''}${evidence.length?`<div class="evlabel">Evidence</div><div class="evrow">${evidence.map(x=>`<button class="evidence" data-evidence="${x}">${x}</button>`).join('')}</div>`:''}`}
function answer(r,q){let s=q.toLowerCase(),sim=/다른 법인|비슷|유사|사례|similar/.test(s),why=/왜|reason|regional/.test(s),impact=/영향|api|interface|데이터|impact/.test(s),risk=/위험|리스크|privacy|risk/.test(s),reuse=/재사용|기존 기능|새 기능|새로운 기능|만들어야|reuse/.test(s),local=/local|로컬|단점/.test(s);if(r.id==='EU-REQ-1042'){if(sim)return block('Similar Requirements','유사한 요구사항 3건을 확인했습니다.',['UK-REQ-0812 · Dealer Selection · Regional Standard','FR-REQ-0927 · Preferred Retailer · Regional Standard','NL-REQ-1001 · Dealer Mapping · Local Extension'],'UK 및 France 사례처럼 Dealer 선택 정보를 Lead와 연결합니다. Regional Standard 검토를 권장합니다.',['UK-REQ-0812','FR-REQ-0927','NL-REQ-1001','GLOBAL-SALES-4.2'],84);if(why)return block('Recommendation','Regional Standard',['유사 요구사항이 유럽 법인에 집중','Dealer 선택 개념은 재사용 가능하지만 Assignment 방식은 지역별 차이','Global 데이터 모델 변경 없이 Regional Process로 확장 가능'],'Global Core 변경보다 European Regional Standard가 적합합니다.',['UK-REQ-0812','FR-REQ-0927','GLOBAL-SALES-4.2'],84);if(impact)return block('Impact Summary','Lead and Dealer integration affected',[`Objects · ${r.objects.join(', ')}`,`APIs · ${r.apis.join(', ')}`,`Interfaces · ${r.interfaces.join(', ')}`],'Dealer assignment regression is required.',['GLOBAL-SALES-4.2'],78);if(reuse||local)return block('Reuse Assessment','Global objects are reusable',['Lead Model · Reusable','Dealer Object · Reusable','Preferred Dealer Mapping · Reusable','Dealer Assignment Rule · Localization Required'],'Regional process extension is preferred over a separate local object.',['GLOBAL-SALES-4.2'],82)}if(r.id==='EU-REQ-1176'){if(risk||why)return block('Highest Risk','Privacy Impact · CRITICAL',['Customer ID and Vehicle ID linkage','Connected Car and Marketing Consent validation','Processing Purpose, Access Role and Retention Policy'],'Human Review Required before release.',['EU-REQ-0731','DE-REQ-0884','FR-REQ-0902'],92,true);if(sim)return block('Related Consent Cases','3 EU requirements identified',['EU-REQ-0731 · Marketing Consent Purpose','DE-REQ-0884 · Connected Vehicle Consent','FR-REQ-0902 · Consent Retention Rule'],'All require responsible privacy organization review.',['EU-REQ-0731','DE-REQ-0884','FR-REQ-0902'],88,true);if(impact)return block('Affected Data','Consent-controlled customer and vehicle data',['Customer ID','Vehicle ID / VIN','Connected Car Consent','Marketing Consent','Consent Updated At','Processing Purpose'],'Connected Vehicle Platform, CRM and Marketing Platform are affected.',['EU-REQ-0731','DE-REQ-0884'],90,true)}if(r.id==='APAC-REQ-0831'){if(local)return block('Local Extension Trade-off','Separate development is not recommended',['Duplicates global lead scoring','Creates market-specific regression scope','Increases release and maintenance cost'],'Reuse Global Standard and isolate only Campaign Mapping.',['GLOBAL-LEAD-3.8'],86);if(reuse||why)return block('Global Capability Reuse','82% available',['Campaign · Available','Lead · Available','Opportunity · Available','Dealer · Available','Customer Activity · Available'],'Do not create a separate feature. Keep EV Campaign Source Mapping as Local Configuration.',['APAC-REQ-0610','GLOBAL-LEAD-3.8'],89)}if(sim)return block('Similar Requirements',`${r.similar.length} related records found`,r.similar,'Review related decisions before classification.',r.similar,72);if(impact)return block('Impact Summary',`${r.objects.length} CRM objects affected`,[`Objects · ${r.objects.join(', ')}`,`APIs · ${r.apis.join(', ')}`,`Interfaces · ${r.interfaces.join(', ')}`],'Run full Impact Analysis before review.',[],75);return block('Recommendation',r.recommendation,[`Standardization Score ${r.score} / 100`,`${r.risk} risk`],'Final decision remains with CRM Governance.',r.similar,r.confidence)}

function renderReleases(){let s=releases.find(x=>x.version===state.release)||releases[0];$('content').innerHTML=`<div class="scroll"><div class="banner"><div><h1>RELEASE GOVERNANCE</h1><p>Coordinate regional packages, regression and deployment readiness</p></div>${assistantControl()}</div><div class="releasegrid"><section class="panel releaselist"><div class="phead"><h2>Releases</h2><small>${releases.length} active</small></div>${releases.map(x=>`<div class="relrow ${s===x?'on':''}" data-release="${x.version}"><h3>${x.version}</h3><p>${badge(x.status)} · ${x.date}</p></div>`).join('')}</section><section class="panel releasedetail"><div class="relhero"><span class="rtype">Release Package</span><h2>▣ ${s.version}</h2><p>${s.scope}</p></div><div class="dbody"><div class="fields"><div class="field"><label>Status</label>${badge(s.status)}</div><div class="field"><label>Deployment Date</label><div>${s.date}</div></div><div class="field full"><label>Markets</label><div>${s.markets.join(', ')}</div></div><div class="field"><label>Included Changes</label><div>${s.changes}</div></div><div class="field"><label>Regression</label><div>${s.regression}</div></div></div><p>Regression progress · ${s.progress}%</p><div class="progress"><i style="width:${s.progress}%"></i></div><section class="dcard" style="margin-top:18px"><div class="dhead">Included Requirements</div><div class="dbody">${s.requirements.map(id=>`<div class="related"><button class="link relreq" data-id="${id}">${id}</button><span>${R.find(r=>r.id===id)?.subject||'Global platform change'}</span><span>${R.find(r=>r.id===id)?.status||'Scheduled'}</span></div>`).join('')}</div></section></div></section></div></div>`;document.querySelectorAll('[data-release]').forEach(x=>x.onclick=()=>{state.release=x.dataset.release;renderReleases()});document.querySelectorAll('.relreq').forEach(x=>x.onclick=()=>R.some(r=>r.id===x.dataset.id)&&openReq(x.dataset.id));bindAssistantControl()}
function openNew(){modal('New Change Request',`<form id="newForm"><div class="formgrid"><label class="formfield"><span>Market</span><input name="market" required></label><label class="formfield"><span>Region</span><select name="region"><option>North America</option><option>Europe</option><option>APAC</option><option>Others</option></select></label><label class="formfield"><span>Domain</span><select name="domain"><option>Sales</option><option>Customer Data</option><option>Marketing</option><option>Service</option></select></label><label class="formfield"><span>Priority</span><select name="priority"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select></label><label class="formfield full"><span>Subject</span><input name="subject" required></label><label class="formfield full"><span>Business Request</span><textarea name="request" required></textarea></label><label class="formfield full"><span>Business Reason</span><textarea name="reason" required></textarea></label><label class="formfield"><span>Requested Date</span><input name="date" type="date" value="2026-09-07"></label></div></form>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="create">Create Request</button>`);$('create').onclick=createReq}
function createReq(){let f=$('newForm');if(!f.reportValidity())return;let d=new FormData(f),reg=d.get('region'),pre=reg==='North America'?'NA':reg==='Europe'?'EU':reg==='APAC'?'APAC':'OT',id=`${pre}-REQ-${Math.max(...R.map(r=>+r.id.match(/\d+$/)?.[0]||0),1191)+1}`;R.unshift({id,region:reg,market:d.get('market'),domain:d.get('domain'),subject:d.get('subject'),standard:'Undecided',risk:d.get('priority')==='Critical'?'Critical':'Medium',status:'Draft',priority:d.get('priority'),owner:'J. Kim',updated:d.get('date'),request:d.get('request'),reason:d.get('reason'),recommendation:'Undecided'});log('J. Kim','Requirement',`${id} created`);closeModal();state.menu='requirements';toast(`${id} created.`);render()}
function openEdit(r){modal('Edit Change Request',`<div class="formgrid"><label class="formfield full"><span>Subject</span><input id="eSubject" value="${esc(r.subject)}"></label><label class="formfield"><span>Priority</span><select id="ePriority">${['Low','Medium','High','Critical'].map(x=>`<option ${r.priority===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="formfield"><span>Owner</span><input id="eOwner" value="${esc(r.owner)}"></label></div>`,`<button class="btn" data-close>Cancel</button><button class="btn primary" id="saveEdit">Save</button>`);$('saveEdit').onclick=()=>{current().subject=$('eSubject').value;current().priority=$('ePriority').value;current().owner=$('eOwner').value;log('J. Kim','Requirement',`${r.id} updated`);closeModal();toast('Requirement updated.');renderDetail()}}
function openEvidence(id){let e=E[id],r=R.find(x=>x.id===id);if(!e&&r)e=[r.market,r.domain,r.subject,r.recommendation||r.standard,r.release||'Unassigned',r.updated];if(!e)return toast('Evidence record is not available.');modal(id,`<div class="preview"><dl><dt>Market</dt><dd>${e[0]}</dd><dt>Domain</dt><dd>${e[1]}</dd><dt>Requirement</dt><dd>${e[2]}</dd><dt>Decision</dt><dd>${e[3]}</dd><dt>Release</dt><dd>${e[4]}</dd><dt>Approved</dt><dd>${e[5]}</dd></dl></div>`,`<button class="btn primary" data-close>Close</button>`,'small')}
function modal(title,body,foot='',size=''){$('modal').className=`modal ${size}`;$('modal').innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="x" data-close>×</button></div><div class="modalbody">${body}</div>${foot?`<div class="modalfoot">${foot}</div>`:''}`;$('backdrop').classList.remove('hidden');document.querySelectorAll('[data-close]').forEach(x=>x.onclick=closeModal)}function closeModal(){$('backdrop').classList.add('hidden')}function log(actor,type,detail){state.audit.unshift({at:new Date().toLocaleString('sv-SE',{timeZone:'Asia/Seoul'}).slice(0,16),actor,type,detail})}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').classList.remove('show'),2500)}
function switchWork(w){$('apps').classList.add('hidden');if(state.workspace==='customer')state.customerQuery=$('globalSearch').value;state.workspace=w==='customer'?'customer':'governance';if(state.workspace==='governance')state.menu='governance';render()}function init(){$('launch').onclick=e=>{e.stopPropagation();$('apps').classList.toggle('hidden')};document.addEventListener('click',e=>{if(!$('apps').contains(e.target)&&e.target!==$('launch'))$('apps').classList.add('hidden');if(!$('shellSearch').contains(e.target))$('cxSearchResults').classList.add('hidden')});document.querySelectorAll('[data-app]').forEach(x=>x.onclick=()=>x.dataset.app==='customer'?switchWork('customer'):x.dataset.app==='releases'?(state.workspace='governance',state.menu='releases',render()):switchWork('governance'));document.querySelectorAll('[data-nav]').forEach(x=>x.onclick=()=>{let v=x.dataset.nav;if(v==='customer')switchWork('customer');else{state.workspace='governance';state.menu=v==='releases'?'releases':'governance';render()}});$('globalSearch').onfocus=()=>state.workspace==='customer'&&mirrorCustomerSearch();$('globalSearch').oninput=()=>{if(state.workspace==='customer'){state.customerQuery=$('globalSearch').value;mirrorCustomerSearch()}};$('globalSearch').onkeydown=e=>{if(e.key!=='Enter')return;if(state.workspace==='customer'){e.preventDefault();mirrorCustomerSearch();$('cxSearchResults').querySelector('.customer-option')?.click();return}state.workspace='governance';state.menu='governance';state.query=e.target.value.trim();state.market='all';render()};$('clearSearch').onclick=()=>{if(state.workspace==='customer'){state.customerQuery='';$('globalSearch').value='';mirrorCustomerSearch();return}$('globalSearch').value='';state.query='';state.kpi='';state.market='all';render()};$('backdrop').onclick=e=>e.target===$('backdrop')&&closeModal();document.addEventListener('keydown',e=>e.key==='Escape'&&closeModal());render()}init();
</script></body></html>
